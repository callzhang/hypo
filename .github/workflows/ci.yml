name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Seconds, and it guards the one thing none of the suites below can: each of
  # them runs its own vector tests, so a client that *disagrees* with the shared
  # fixtures already fails. A client that stops reading them is green.
  shared-fixtures:
    name: Shared Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Every client still reads the shared fixtures
        run: ./scripts/check-shared-fixtures.sh

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run backend tests
        working-directory: backend
        run: cargo test --all-features --locked

  android-tests:
    name: Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          chmod +x ./scripts/setup-android-sdk.sh
          ./scripts/setup-android-sdk.sh
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
          # The build refuses to produce an APK with no relay token, because one
          # 401s on every connection. That guard is right for something you
          # install and wrong here: this job runs unit tests and ships nothing,
          # and CI has no token to give it. Without this the whole Android job
          # fails before a single test runs.
          ALLOW_MISSING_RELAY_TOKEN: "1"

  macos-tests:
    name: macOS Tests
    runs-on: macos-15
    # Raised from 10, which this job had grown into: the run at 33256583728 was
    # cancelled at 10m19s and passed on re-run with no code change. The caching
    # below should keep it far under, but the headroom is the insurance.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove Conflicting Workspace
        working-directory: macos
        run: rm -rf HypoApp.xcworkspace
      - name: Record the Xcode version
        # Must precede the cache step: DerivedData is not portable across
        # toolchains, so the Xcode build number belongs in the cache key.
        run: echo "XCODE_BUILD=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ')" >> "$GITHUB_ENV"
      - name: Cache SwiftPM checkouts and build products
        uses: actions/cache@v4
        with:
          # Both paths are pinned explicitly by the xcodebuild flags below.
          # DerivedData is what actually matters: the expensive part of a cold
          # run is compiling swift-syntax, a macro package, not fetching it.
          path: |
            macos/.spm-cache
            macos/.derived
          # Xcode version is in the key because DerivedData is not portable
          # across toolchains. No restore-keys on purpose: a partially stale
          # DerivedData is a well-known source of baffling build failures, and
          # a cold build is better than a poisoned one.
          #
          # The manifests, not Package.resolved: this repository has never
          # committed one, so hashFiles found nothing, every run shared one key,
          # and DerivedData built against a dependency that had since been
          # removed was restored on top of the new manifest. That is the
          # poisoned cache this comment warns about, arriving through the key.
          key: macos-spm-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved', 'shared/HypoCore/Package.swift') }}
      - name: List Schemes
        working-directory: macos
        run: xcodebuild -list
      - name: Run Swift tests
        working-directory: macos
        run: |
          xcodebuild test \
            -scheme HypoApp-Package \
            -destination 'platform=macOS' \
            -skipMacroValidation \
            -enableCodeCoverage NO \
            -clonedSourcePackagesDirPath .spm-cache \
            -derivedDataPath .derived \
            -resultBundlePath "$RUNNER_TEMP/hypo-macos-tests.xcresult"
      - name: Summarize macOS test failures
        if: failure()
        run: |
          if [ ! -e "$RUNNER_TEMP/hypo-macos-tests.xcresult" ]; then
            echo "xcresult bundle not found."
            exit 0
          fi
          xcrun xcresulttool get object \
            --legacy \
            --format json \
            --path "$RUNNER_TEMP/hypo-macos-tests.xcresult" \
            | python3 - <<'PY'
          import json
          import sys
          
          payload = sys.stdin.read().strip()
          if not payload:
            print("xcresulttool returned no data.")
            sys.exit(0)
          data = json.loads(payload)
          issues = data.get("issues", {}).get("testFailureSummaries", {}).get("_values", [])
          if not issues:
              print("No test failure summaries found.")
              sys.exit(0)
          print("Failing tests:")
          for item in issues:
              test_name = item.get("testCaseName", {}).get("_value", "unknown")
              message = item.get("message", {}).get("_value", "")
              file_name = item.get("fileName", {}).get("_value", "")
              line = item.get("lineNumber", {}).get("_value", "")
              location = f"{file_name}:{line}" if file_name else ""
              if location:
                  print(f"- {test_name} ({location}) {message}")
              else:
                  print(f"- {test_name} {message}")
          PY
      - name: Upload macOS xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/hypo-macos-tests.xcresult

  ios-core-build:
    name: HypoCore iOS Build
    # macos-26 rather than macos-15: the older image ships Xcode 16.4, two
    # major versions behind what this app is developed against, and Swift 6.1
    # rejects actor-isolation that 6.3 accepts. CI was the only place those
    # divergences showed up, one push at a time. Matching the toolchains means
    # a local build can catch them instead.
    runs-on: macos-26
    # Generous, because the whole job is inside this: it builds for the
    # simulator, for macOS, then runs tests on a simulator, compiling
    # swift-syntax from scratch on the way since nothing here is cached. A
    # 15-minute limit finished at 14 on a good run and cancelled at 15 on the
    # next, which reads as a broken build rather than a tight limit. The
    # individual steps carry their own timeouts, so a hang still says where.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show available iOS SDKs and simulators
        run: |
          xcodebuild -showsdks | grep -i ios || true
          xcrun simctl list devices available | grep -i iphone || true
      # Resolved once, not hardcoded. A pinned "iPhone 16" is only correct for
      # one Xcode, and when the runner image moved on the device was simply
      # absent — which xcodebuild reported by hanging until the job timed out.
      - name: Pick a simulator
        run: |
          DEVICE="$(xcrun simctl list devices available \
            | sed -n 's/^ *\(iPhone[^(]*\) (.*/\1/p' | sed 's/ *$//' | tail -1)"
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator on this image"; xcrun simctl list devices available; exit 1
          fi
          echo "Using $DEVICE"
          echo "IOS_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
      - name: Build HypoCore for iOS Simulator
        working-directory: shared/HypoCore
        run: |
          xcodebuild build \
            -scheme HypoCore \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation
      - name: Build HypoCore for macOS
        working-directory: shared/HypoCore
        run: swift build
      # Via the wrapper, not xcodebuild directly: xcodebuild prints
      # "** TEST SUCCEEDED **" and exits 0 even when Swift Testing tests fail,
      # because it only tallies XCTest results and these packages have none.
      - name: Run HypoCore tests on iOS Simulator
        timeout-minutes: 20
        run: ./scripts/run-ios-tests.sh shared/HypoCore HypoCore "$IOS_SIMULATOR"
      - name: Build HypoiOS for iOS Simulator
        working-directory: shared/HypoiOS
        run: |
          xcodebuild build \
            -scheme HypoiOS \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation
      - name: Run HypoiOS tests on iOS Simulator
        timeout-minutes: 20
        run: ./scripts/run-ios-tests.sh shared/HypoiOS HypoiOS "$IOS_SIMULATOR"
      # Builds and drives the app. These are XCUITest, so xcodebuild's exit
      # code is meaningful here — unlike the Swift Testing suites above, which
      # need scripts/run-ios-tests.sh to notice failures at all.
      # CODE_SIGNING_ALLOWED=NO because the runner has no signing certificate
      # and a simulator build does not need one.
      - name: Build and UI-test the iOS app
        timeout-minutes: 30
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme Hypo \
            -destination "platform=iOS Simulator,name=$IOS_SIMULATOR" \
            -skipMacroValidation \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO
      # The local network permission prompt cannot be tested on a simulator,
      # which does not enforce it. What can be checked is the declaration it
      # depends on: without these keys iOS refuses Bonjour with no error and no
      # prompt, and devices simply never appear.
      - name: Check the iOS app declares local network access
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData/Hypo-* -name Hypo.app -path '*iphonesimulator*' | head -1)
          ./scripts/check-ios-local-network.sh "$APP"
  windows-tests:
    name: Windows Core Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        working-directory: windows
        run: dotnet restore
      - name: Build
        working-directory: windows
        run: dotnet build --no-restore --configuration Release
      - name: Run Windows core tests
        working-directory: windows
        env:
          # Somewhere predictable for the interface screenshots the WPF tests
          # take, so they can be collected below.
          HYPO_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory coverage
      # Hypo.Core is where the protocol, the crypto and the transports live, and
      # it has no UI and no Win32 dependency, so there is no excuse for a gap in
      # it. The gate is the repository's 80%; it sits around 89% today, and the
      # point of the number is to notice a fall rather than to celebrate a rise.
      #
      # Reading the run above rather than running the suite again: a second run
      # doubles the exposure to anything flaky, and it cost a green build the
      # first time this existed.
      - name: Check Hypo.Core coverage
        working-directory: windows
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          if not reports:
              sys.exit("No coverage report was produced.")

          # The best any single suite manages, not the union of all of them.
          # Merging would need another tool; the best is never higher than the
          # union, so this gate can only be too strict, never too lax.
          rates = [
              float(package.get("line-rate")) * 100
              for report in reports
              for package in ET.parse(report).getroot().iter("package")
              if package.get("name") == "Hypo.Core"
          ]

          if not rates:
              sys.exit("No report covered Hypo.Core.")

          rate = max(rates)
          print(f"Hypo.Core line coverage: {rate:.1f}%")

          if rate < 80:
              sys.exit(f"Coverage fell to {rate:.1f}%, below the repository's 80% floor.")
          PY
      # The runner is a fully interactive session -- it shows windows and renders
      # them -- so these are the only way anyone without a Windows machine sees
      # the interface at all.
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypo-ui-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
      # Publishes something a person can download and run. Without this, "CI is
      # green" is the only evidence the Windows client works, and it is not the
      # kind of evidence anyone can act on.
      - name: Publish the console client
        working-directory: windows
        run: >
          dotnet publish src/Hypo.Windows/Hypo.Windows.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true --output ../artifacts/hypo-win-x64
      - name: Upload the console client
        uses: actions/upload-artifact@v4
        with:
          name: hypo-console-win-x64
          path: artifacts/hypo-win-x64
          if-no-files-found: error
      # The tray application runs here and is screenshotted above. What is still
      # out of reach is a second monitor, a session lock, and a day of someone
      # using it. Publishing it is how a person on Windows judges that.
      - name: Publish the tray application
        working-directory: windows
        run: >
          dotnet publish src/Hypo.Windows.App/Hypo.Windows.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output ../artifacts/hypo-app-win-x64
      - name: Upload the tray application
        uses: actions/upload-artifact@v4
        with:
          name: hypo-app-win-x64
          path: artifacts/hypo-app-win-x64
          if-no-files-found: error
      # ARM64 is in the design's support matrix and was never built. It matters
      # more than it looks: a Windows VM on an Apple Silicon Mac is ARM64, so
      # without this the only way to try the app is under x64 emulation.
      - name: Publish the tray application (ARM64)
        working-directory: windows
        run: >
          dotnet publish src/Hypo.Windows.App/Hypo.Windows.App.csproj
          --configuration Release --runtime win-arm64 --self-contained true
          --output ../artifacts/hypo-app-win-arm64
      - name: Upload the tray application (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: hypo-app-win-arm64
          path: artifacts/hypo-app-win-arm64
          if-no-files-found: error
